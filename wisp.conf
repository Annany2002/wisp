server {
    listen 8443;
    server_name localhost;

    # path to ssl certificate
    ssl_certificate     ./cert.pem;

    # path to ssl certificate key
    ssl_certificate_key ./key.pem;

    location / {
        root ./wisp_test_site;
    }
}